name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        # Windows too: contributors build there, and shell-only commands (rm, chmod) break on it.
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: CLI against the example app
        if: runner.os == 'Linux'
        run: |
          node examples/bookstore/server.mjs &
          sleep 1
          # The example has one deliberate bug: exit code 1 is the expected result.
          set +e
          node dist/cli/main.js run -c examples/bookstore/noxeval.config.mjs
          test $? -eq 1
