name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: CLI against the example app
        run: |
          node examples/bookstore/server.mjs &
          sleep 1
          # The example has one deliberate bug: exit code 1 is the expected result.
          set +e
          node dist/cli/main.js run -c examples/bookstore/noxeval.config.mjs
          test $? -eq 1
